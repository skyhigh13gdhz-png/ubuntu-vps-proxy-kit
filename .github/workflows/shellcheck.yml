name: shell-check

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n setup.sh lib/common.sh scripts/*.sh
      - name: ShellCheck
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck
          shellcheck -x setup.sh lib/common.sh scripts/*.sh
